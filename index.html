<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071c24">
  <title>En ny webbplats är på väg</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #071c24;
      --teal: #0d5356;
      --mint: #8fd3c5;
      --gold: #d9b46d;
      --paper: #f4f1e9;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--paper);
      background:
        radial-gradient(circle at 15% 20%, rgba(18, 116, 112, .38), transparent 34%),
        radial-gradient(circle at 85% 80%, rgba(217, 180, 109, .15), transparent 32%),
        linear-gradient(135deg, #06171f 0%, var(--navy) 48%, #0a3035 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image:
        linear-gradient(rgba(255,255,255,.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.09) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, transparent, #000 24%, #000 76%, transparent);
    }

    main {
      position: relative;
      width: min(920px, calc(100% - 40px));
      padding: clamp(46px, 8vw, 92px);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px;
      background: rgba(5, 24, 31, .68);
      box-shadow: 0 40px 100px rgba(0,0,0,.34);
      backdrop-filter: blur(16px);
    }

    .mark {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 54px;
      color: var(--mint);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .mark::before {
      content: "";
      width: 42px;
      height: 2px;
      background: linear-gradient(90deg, var(--gold), var(--mint));
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(48px, 8vw, 96px);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.045em;
    }

    p {
      max-width: 610px;
      margin: 34px 0 0;
      color: rgba(244, 241, 233, .72);
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.7;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-top: 50px;
      color: rgba(244, 241, 233, .58);
      font-size: 13px;
    }

    .status span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 7px rgba(143, 211, 197, .1);
    }

    @media (max-width: 600px) {
      main { padding: 44px 28px; border-radius: 20px; }
      .mark { margin-bottom: 38px; }
      .status { margin-top: 38px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">Under utveckling</div>
    <h1>Något nytt är på väg.</h1>
    <p>Vi arbetar just nu med en helt ny webbplats. Snart öppnar vi dörrarna – med ett nytt innehåll, ett nytt uttryck och fler anledningar att komma tillbaka.</p>
    <div class="status"><span aria-hidden="true"></span>Arbetet pågår – välkommen tillbaka snart.</div>
  </main>
</body>
</html>
